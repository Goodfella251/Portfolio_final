<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    html { scroll-behavior: smooth; }
    body { margin: 0; background: #151310; }
    ::selection { background: rgba(176,120,74,0.35); color: #F3EEE5; }

    @media (max-width: 900px) {
      .metrics-grid, .context-row, .visuals-grid { grid-template-columns: 1fr !important; }
      .metrics-grid > div { border-right: none !important; margin-right: 0 !important; border-bottom: 1px solid #2B2822; padding: 48px 0 !important; }
      .metrics-grid > div:last-child { border-bottom: none; }
      .context-row { gap: 16px !important; }
      .visual-side { grid-template-rows: none !important; }
      .visuals-grid > div, .visual-side > div { min-width: 0; }
      .visual-side > div { aspect-ratio: 16 / 9; }
      .avast-modals-grid { grid-template-columns: 1fr !important; max-width: 420px; margin-left: auto; margin-right: auto; }
    }

    @media (max-width: 520px) {
      header, section, footer > div { padding-left: 24px !important; padding-right: 24px !important; }
    }
  </style>
</helmet>

<div style="--ac: {{ accent }}; background: #151310; color: #F3EEE5; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; min-height: 100vh; -webkit-font-smoothing: antialiased;">

  <!-- ===== NAV ===== -->
  <nav style="display: flex; justify-content: space-between; align-items: baseline; max-width: 1240px; margin: 0 auto; padding: 36px 40px 0 40px;">
    <a href="index.html" style="font-family: 'Instrument Serif', serif; font-size: 22px; color: #F3EEE5; text-decoration: none;">JGV<span style="color: var(--ac, #D9A441);">.</span></a>
    <a href="index.html#work" onClick="{{ backToWork }}" style="font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: #99927F; text-decoration: none;" style-hover="color: var(--ac, #D9A441);">← Back to All Work</a>
  </nav>

  <!-- ===== HEADER ===== -->
  <header style="max-width: 1240px; margin: 0 auto; padding: 120px 40px 0 40px;">
    <p style="margin: 0 0 34px 0; font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 13px; letter-spacing: 0.22em; text-transform: uppercase; color: #99927F;">{{ kicker }}</p>
    <h1 style="margin: 0; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: clamp(60px, 9vw, 130px); line-height: 0.98; letter-spacing: -0.015em; color: #F3EEE5; text-wrap: balance;">{{ title }}</h1>
    <p style="margin: 44px 0 0 0; max-width: 680px; font-size: 21px; line-height: 1.6; color: #99927F; text-wrap: pretty;">{{ subtitle }}</p>
  </header>

  <!-- ===== METRIC BAND ===== -->
  <section aria-label="Key metrics" style="max-width: 1240px; margin: 100px auto 0 auto; padding: 0 40px;">
    <div class="metrics-grid" style="display: grid; grid-template-columns: repeat(2, 1fr); border-top: 1px solid #2B2822; border-bottom: 1px solid #2B2822; overflow: hidden;">
      <sc-for list="{{ metrics }}" as="m" hint-placeholder-count="2">
        <div style="padding: 56px 32px; border-right: 1px solid #2B2822; margin-right: -1px;">
          <div style="width: 28px; height: 2px; background: var(--ac, #D9A441); margin-bottom: 28px;"></div>
          <p style="margin: 0; font-family: 'Instrument Serif', serif; font-size: clamp(52px, 6vw, 88px); line-height: 1; color: #F3EEE5;">{{ m.value }}</p>
          <p style="margin: 18px 0 0 0; font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: #99927F;">{{ m.label }}</p>
        </div>
      </sc-for>
    </div>
  </section>

  <!-- ===== CONTEXT ===== -->
  <section style="max-width: 1240px; margin: 0 auto; padding: 130px 40px 0 40px;">
    <sc-for list="{{ sections }}" as="s" hint-placeholder-count="3">
      <div class="context-row" style="display: grid; grid-template-columns: 240px 1fr; gap: 48px; align-items: start; padding: 44px 0; border-top: 1px solid #2B2822;">
        <p style="margin: 0; font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ac, #D9A441); padding-top: 6px;">{{ s.label }}</p>
        <p style="margin: 0; max-width: 720px; font-size: 19px; line-height: 1.75; color: #C4BDAD; text-wrap: pretty;">{{ s.text }}</p>
      </div>
    </sc-for>
  </section>

  <!-- ===== VISUALS ===== -->
  <section aria-label="Product visuals" style="max-width: 1240px; margin: 0 auto; padding: 110px 40px 0 40px;">
    <!-- Threat Intelligence dashboard — wide hero -->
    <div onClick="{{ openLightboxThreats }}" style="aspect-ratio: 1440 / 742; background: #1C1915; border: 1px solid #2B2822; overflow: hidden; cursor: zoom-in;">
      <img src="assets/avast_with threats.png" alt="Avast portal Threat Intelligence dashboard" style="width: 100%; height: 100%; object-fit: cover; object-position: top; display: block;">
    </div>
    <!-- Retention & AI dynamic pricing flows — two portrait modals -->
    <div class="avast-modals-grid" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; margin-top: 24px;">
      <div onClick="{{ openLightboxRetain }}" style="aspect-ratio: 706 / 856; background: #1C1915; border: 1px solid #2B2822; overflow: hidden; display: flex; align-items: flex-start; justify-content: center; cursor: zoom-in;">
        <img src="assets/avast_retain.png" alt="Avast subscription retention flow" style="width: 100%; height: 100%; object-fit: cover; object-position: top; display: block;">
      </div>
      <div onClick="{{ openLightboxDiscount }}" style="aspect-ratio: 706 / 856; background: #1C1915; border: 1px solid #2B2822; overflow: hidden; display: flex; align-items: flex-start; justify-content: center; cursor: zoom-in;">
        <img src="assets/avast_ discount - benefits.png" alt="Avast AI dynamic pricing discount offer" style="width: 100%; height: 100%; object-fit: cover; object-position: top; display: block;">
      </div>
    </div>
  </section>

  <!-- ===== LIGHTBOX ===== -->
  <sc-if value="{{ lightboxOpen }}">
    <div onClick="{{ closeLightbox }}" style="position: fixed; inset: 0; z-index: 1000; background: rgba(10,9,7,0.92); display: flex; align-items: center; justify-content: center; padding: 40px; backdrop-filter: blur(4px);">
      <button onClick="{{ closeLightbox }}" aria-label="Close" style="position: absolute; top: 28px; right: 32px; width: 44px; height: 44px; border-radius: 50%; border: 1px solid #2B2822; background: #1C1915; color: #F3EEE5; font-size: 20px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center;" style-hover="color: var(--ac, #D9A441); border-color: var(--ac, #D9A441);">&times;</button>
      <img src="{{ lightboxSrc }}" alt="{{ lightboxAlt }}" onClick="{{ stopPropagation }}" style="max-width: 100%; max-height: 100%; object-fit: contain; display: block; box-shadow: 0 20px 60px rgba(0,0,0,0.5);">
    </div>
  </sc-if>

  <!-- ===== OUTCOME ===== -->
  <section style="max-width: 1240px; margin: 0 auto; padding: 140px 40px 130px 40px;">
    <div style="border-top: 1px solid #2B2822; padding-top: 72px;">
      <p style="margin: 0 0 40px 0; font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: #99927F;">The outcome</p>
      <p style="margin: 0; max-width: 900px; font-family: 'Instrument Serif', serif; font-size: clamp(30px, 3.6vw, 50px); line-height: 1.25; color: #F3EEE5; text-wrap: balance;">{{ outcome }}</p>
      <a href="index.html#work" onClick="{{ backToWork }}" style="display: inline-block; margin-top: 64px; font-size: 15px; color: #F3EEE5; text-decoration: none; border-bottom: 1px solid var(--ac, #D9A441); padding-bottom: 4px;" style-hover="color: var(--ac, #D9A441);">← Back to All Work</a>
    </div>
  </section>

  <!-- ===== FOOTER ===== -->
  <footer style="border-top: 1px solid #2B2822;">
    <div style="max-width: 1240px; margin: 0 auto; padding: 36px 40px; display: flex; justify-content: space-between; align-items: baseline;">
      <p style="margin: 0; font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 12px; letter-spacing: 0.15em; text-transform: uppercase; color: #6B655A;">Jose Garcia Valverde — 2026</p>
      <a href="index.html" style="font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: #99927F; text-decoration: none;" style-hover="color: var(--ac, #D9A441);">Main portfolio</a>
    </div>
  </footer>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#D9A441&quot;,&quot;options&quot;:[&quot;#E26A33&quot;,&quot;#D9A441&quot;,&quot;#D9A441&quot;,&quot;#C8502E&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Theme&quot;},&quot;kicker&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Case study — Gen Digital, 2024 · 2026&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Avast &amp; AVG Portals&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;subtitle&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Leading product strategy for the customer portals behind Avast and AVG multi-product subscriptions, serving 400M+ users worldwide.&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;metrics&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{value: string, label: string}[]&quot;},&quot;sections&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{label: string, text: string}[]&quot;},&quot;outcome&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Generated $10M in annual revenue, drove a 1% churn reduction via AI dynamic pricing, and doubled engineering delivery velocity.&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Content&quot;}}">
class Component extends DCLogic {
  state = { lightboxSrc: null, lightboxAlt: '' };

  // Return to the visitor's previous scroll position on the homepage when they
  // navigated here from it; direct visitors fall through to the #work anchor.
  backToWork = (e) => {
    let fromHome = false;
    try {
      const ref = new URL(document.referrer);
      fromHome = ref.origin === location.origin && (/(^|\/)index\.html$/.test(ref.pathname) || /\/$/.test(ref.pathname));
    } catch (err) {}
    if (fromHome && history.length > 1) {
      e.preventDefault();
      history.back();
    }
  };

  openLightboxThreats = () => this.setState({ lightboxSrc: 'assets/avast_with threats.png', lightboxAlt: 'Avast portal Threat Intelligence dashboard' });
  openLightboxRetain = () => this.setState({ lightboxSrc: 'assets/avast_retain.png', lightboxAlt: 'Avast subscription retention flow' });
  openLightboxDiscount = () => this.setState({ lightboxSrc: 'assets/avast_ discount - benefits.png', lightboxAlt: 'Avast AI dynamic pricing discount offer' });
  closeLightbox = () => this.setState({ lightboxSrc: null, lightboxAlt: '' });
  stopPropagation = (e) => e.stopPropagation();

  renderVals() {
    const p = this.props;
    return {
      backToWork: this.backToWork,
      openLightboxThreats: this.openLightboxThreats,
      openLightboxRetain: this.openLightboxRetain,
      openLightboxDiscount: this.openLightboxDiscount,
      closeLightbox: this.closeLightbox,
      stopPropagation: this.stopPropagation,
      lightboxOpen: !!this.state.lightboxSrc,
      lightboxSrc: this.state.lightboxSrc,
      lightboxAlt: this.state.lightboxAlt,
      accent: p.accent ?? '#D9A441',
      kicker: p.kicker ?? 'Case study — Gen Digital, 2024 · 2026',
      title: p.title ?? 'Avast & AVG Portals',
      subtitle: p.subtitle ?? 'Leading product strategy for the customer portals behind Avast and AVG multi-product subscriptions, serving 400M+ users worldwide.',
      metrics: p.metrics ?? [
        { value: '$10M', label: 'Annual revenue generated' },
        { value: '400M+', label: 'Users served worldwide' },
      ],
      sections: p.sections ?? [
        {
          label: 'The problem',
          text: 'Delivery processes were fragmented, developers lacked clear direction, and the roadmap was driven by sales rather than product vision.',
        },
        {
          label: 'My role',
          text: 'Aligned with sales on key priorities and critical fixes, established structured delivery workflows with the development team, and launched a Threat Intelligence dashboard that reduced customer churn.',
        },
        {
          label: 'The approach',
          text: 'Shifted the product strategy from fragmented brand updates to a unified growth engine, aligning cross-functional squads to revamp the delivery pipeline and piloting AI dynamic pricing to proactively drive customer retention.',
        },
      ],
      outcome: p.outcome ?? 'Generated $10M in annual revenue, drove a 1% churn reduction via AI dynamic pricing, and doubled engineering delivery velocity.',
    };
  }
}
</script>
</body>
</html>
